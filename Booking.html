
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking Form</title>

    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">
            <h2 class="logo">IPL TICKETS</h2>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#matches">Matches</a></li>
                <li><a href="#booking-form">Book Ticket</a></li>
                <li><a href="index.html#guidelines">Guidelines</a></li>
            </ul>
        </nav>
    </header>

    <!-- Booking Form -->
    <section class="booking-section">

        <div class="booking-container">

            <h1>IPL Ticket Booking Form</h1>
            <p>Fill in your details to book your favourite match.</p>

            <form action="#" method="get" id="booking-form">

                <!-- Personal Details -->
                <fieldset>
                    <legend>Personal Details</legend>

                    <label for="name">Full Name</label>
                    <input type="text"
                           id="name"
                           name="name"
                           placeholder="Enter your full name"
                           minlength="3"
                           maxlength="30"
                           required>

                    <label for="email">Email Address</label>
                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="Enter your email"
                           required>

                    <label for="phone">Phone Number</label>
                    <input type="tel"
                           id="phone"
                           name="phone"
                           placeholder="Enter 10 digit number"
                           pattern="[6-9][0-9]{9}"
                           title="Enter a valid 10 digit Indian mobile number"
                           required>
                </fieldset>

                <!-- Ticket Details -->
                <fieldset>
                    <legend>Ticket Details</legend>

                    <label for="match">Select Match</label>

                    <select id="match" name="match" required>
                        <option value="">-- Select Match --</option>
                        <option value="RCB vs CSK">RCB vs CSK</option>
                        <option value="MI vs KKR">MI vs KKR</option>
                        <option value="CSK vs MI">CSK vs MI</option>
                        <option value="RCB vs MI">RCB vs MI</option>
                    </select>

                    <label for="stand">Select Stand Category</label>

                    <select id="stand" name="stand" required>
                        <option value="">-- Select Stand --</option>
                        <option value="General">General</option>
                        <option value="Premium">Premium</option>
                        <option value="VIP">VIP</option>
                    </select>

                    <label for="tickets">Number of Tickets</label>

                    <input type="number"
                           id="tickets"
                           name="tickets"
                           min="1"
                           max="10"
                           required>
                </fieldset>

                <!-- Additional Preferences -->
                <fieldset>
                    <legend>Additional Preferences</legend>

                    <p>Food Preference:</p>

                    <input type="radio"
                           id="veg"
                           name="food"
                           value="Vegetarian">

                    <label for="veg" class="inline-label">
                        Vegetarian
                    </label>

                    <input type="radio"
                           id="nonveg"
                           name="food"
                           value="Non-Vegetarian">

                    <label for="nonveg" class="inline-label">
                        Non-Vegetarian
                    </label>

                    <br><br>

                    <input type="checkbox"
                           id="terms"
                           name="terms"
                           required>

                    <label for="terms" class="inline-label">
                        I agree to the terms and conditions.
                    </label>

                </fieldset>

                <!-- Form Buttons -->
                <div class="form-buttons">

                    <button type="submit">
                        Submit Booking
                    </button>

                    <button type="reset" class="reset-btn">
                        Reset Form
                    </button>

                </div>

            </form>

            <p class="back-link">
                <a href="index.html">← Back to Home</a>
            </p>

        </div>

    </section>

    <!-- Toast Notification -->
    <div id="toast" class="toast"
         role="status" aria-live="polite"></div>

    <!-- Footer -->
    <footer>
        <p>© 2026 IPL Ticket Booking | All Rights Reserved</p>
    </footer>

</body>
</html>
